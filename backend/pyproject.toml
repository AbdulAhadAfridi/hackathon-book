[project]
name = "rag-ingestion-pipeline"
version = "0.1.0"
description = "RAG backend ingestion pipeline for Docusaurus-based book"
authors = [{name = "User", email = "user@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "cohere>=4.0.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
rag-ingest = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"